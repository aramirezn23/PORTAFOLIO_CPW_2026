<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro del sitio-demo">
    <meta name="keywords" content="registro, formulario, sitio-demo">
    <meta name="author" content="Adrián Ramírez Navarro">
    <title>Formulario | Registro</title>
</head>
<body>

    <header>
    <!--Cabecera de la página y generalmente se repite en todo el sitio -->
    <h1>Codificación de páginas web</h1>
    <p>Sitio de demostración de módulo</p>
        <nav>
                <ul>
                    <li><a href="Index.html">Inicio</a></li>
                    <li><a href="Articulo.html">Artículo</a></li>
                    <li><a href="Horario.html">Horario</a></li>
                    <li><a href="Registro.html">Registro</a></li>
                </ul>
            <!--nav>ul>li*4>a-->
        </nav>
    </header>

    <main>

        <h2>Formulario de matrícula</h2>
        <form action="#" method="post">
            <!--FORM: Contenedor del formlario. Action es donde se envía el formulario
            method: es el método de envío. Post: Envío de datos por el cuerpo de la solicitud-->
            <fieldset>
                <legend>Información personal</legend>
                <p>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" required><br><br>
                </p>
               <p>
                    <label for="correo">Correo electrónico</label>
                    <input type="email" name="correo" id="correo" required><br><br>
                </p>
                <button type="submit">Enviar matrícula</button>      
            </fieldset>
        </form>

        <fieldset>
            <legend>Detalles de matrícula</legend>
            <p>
                <label for="Teléfono">Teléfono</label>
                <input type="tel" id="Teléfono" name="teléfono" pattern="(0-9)(8)" title="Ingrese un número de teléfono válido de 8 dígitos"><br><br>
            </p>
            <p>
                <label for="fecha">Fecha de Inicio</label>
                <input type="date" id="fecha" name="fecha"><br><br>
            </p>
            <p>
                <label for="edad">Edad</label>
                <input type="number" id="edad" name="edad" min="15" max="80" step="1"><br><br>
            </p>

        </fieldset>

        <fieldset>
            <legend>Modalidad</legend>
            <input type="radio" id="presencial" name="modalidad" value="presencial">
            <label for="presencial">Presencial</label><br>
            <input type="radio" id="virtual" name="modalidad" value="virtual">
            <label for="virtual">Virtual</label><br>
            <input type="radio" id="mixta" name="modalidad" value="mixta">
            <label for="mixta">Mixta</label><br><br>
        
        <p>
            <label for="Horario">Horario preferido</label><br>
            <select name="horario" id="horario">
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select><br><br>
        </p>
        <p>
            <label for="comentarios">Comentarios</label>
            <textarea name="comentarios" id="comentarios" rows="4" cols="50" maxlength="200"></textarea><br><br>
        </p>
        </fieldset>
    </main>

    <footer>
        <!--Footer, pie, créditos, contacto, derechos-->
        <p>®2026 INA. Programa Desarrollo de Páginas Web. Todos los derechos reservados</p>
    </footer>
    
</body>
</html>
